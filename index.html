<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EDU 学习空间，课程、资源与作品的起点。">
  <title>EDU · 学习空间</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f4f6fb; color: #18233e; }
    main { width: min(100%, 680px); padding: clamp(28px, 7vw, 64px); border: 1px solid #e0e5f0; border-radius: 24px; background: #fff; }
    .label { margin: 0 0 28px; color: #4757b8; font-size: 14px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 0 0 20px; font-size: clamp(32px, 7vw, 48px); line-height: 1.25; letter-spacing: -.04em; }
    .intro { margin: 0; max-width: 34em; color: #5b6478; font-size: 18px; line-height: 1.8; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin: 36px 0 0; padding: 8px 14px; border-radius: 999px; background: #edf7f1; color: #246342; font-size: 14px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #337d53; }
    footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid #edf0f6; color: #626c81; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="label">EDU / 学习空间</p>
    <h1>从这里，开始探索。</h1>
    <p class="intro">欢迎来到 EDU。这里将用于分享课程、学习资源与项目作品，更多内容正在准备中。</p>
    <p class="status"><span class="dot" aria-hidden="true"></span>网站已上线</p>
    <footer>学习 · 创作 · 分享</footer>
  </main>
</body>
</html>
